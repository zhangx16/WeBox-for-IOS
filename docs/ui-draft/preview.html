<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>WeBox · 界面预览</title>
<style>
:root{--gap:16px;--fs:16px;--ratio:1.25;--measure:56ch;--radius:16px;--hue:263;--ink:12%;--surface:96%;--line:88%;--edge:1px;--shadow:0;--room:1.75;--dur:160ms;--ease:cubic-bezier(.2,0,0,1);--accent:#195edb;--paper:#fff;--text:#1c1c1e;--muted:#636366;--background:#f2f2f7}
.dark{--ink:94%;--surface:12%;--line:28%;--accent:#529eff;--paper:#1c1c1e;--text:#f5f5f7;--muted:#aeaeb2;--background:#000}
@media(prefers-reduced-motion:reduce){:root{--dur:0ms}}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:var(--fs)/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;color:inherit;background:transparent}a{color:var(--accent);text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:calc(var(--fs)*var(--ratio)*var(--ratio)*var(--ratio));line-height:1.12;letter-spacing:-.03em}h2{font-size:calc(var(--fs)*var(--ratio));font-weight:700}h3{font-size:var(--fs);font-weight:650}.muted{color:var(--muted)}.small{font-size:calc(var(--fs)/var(--ratio))}.shell{max-width:900px;margin:auto;padding:calc(var(--gap)*1.5) calc(var(--gap)*1.25) calc(var(--gap)*7)}.header{display:flex;justify-content:space-between;gap:var(--gap);align-items:center}.subtitle{margin-top:calc(var(--gap)*.5);color:var(--muted);font-size:calc(var(--fs)/var(--ratio))}.icon-button{display:grid;place-items:center;background:var(--paper);border-radius:50%;width:44px;height:44px;flex-shrink:0;color:var(--accent);font-size:calc(var(--fs)*var(--ratio)*var(--ratio))}.search-button{margin-top:calc(var(--gap)*1.25);display:flex;align-items:center;gap:calc(var(--gap)*.65);padding:0 var(--gap);width:100%;min-height:50px;border-radius:var(--radius);background:var(--paper);color:var(--muted);text-align:left}.search-button .scope{margin-left:auto;font-size:calc(var(--fs)/var(--ratio))}section{margin-top:calc(var(--gap)*var(--room))}.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:calc(var(--gap)*.75);margin-bottom:calc(var(--gap)*.75)}.section-heading a,.section-heading button{color:var(--accent);font-size:calc(var(--fs)/var(--ratio));min-height:44px;display:inline-flex;align-items:center}.chips{display:flex;gap:calc(var(--gap)*.5);overflow:auto;padding:2px 0;scrollbar-width:none}.chip{white-space:nowrap;border-radius:999px;padding:0 var(--gap);min-height:44px;background:var(--paper);font-size:calc(var(--fs)/var(--ratio));border:var(--edge) solid transparent}.chip[aria-pressed=true]{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--paper));border-color:color-mix(in srgb,var(--accent) 40%,transparent);font-weight:650}.actions{display:flex;gap:var(--gap);align-items:center}.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:calc(var(--gap)*.75);align-items:start}.poster-card{text-align:left;padding:0}.poster{width:100%;aspect-ratio:2/3;display:grid;place-items:center;background:var(--paper);border-radius:calc(var(--radius)*.75);overflow:hidden}.poster img{width:80%;border-radius:calc(var(--radius)*.75)}.poster-card h3{margin-top:calc(var(--gap)*.5);font-size:calc(var(--fs)/var(--ratio));line-height:1.4}.poster-card p{font-size:calc(var(--fs)/var(--ratio));margin-top:calc(var(--gap)*.25);color:var(--muted)}.source-message{padding:calc(var(--gap)*1.25);background:var(--paper);border-radius:var(--radius);line-height:1.65}.source-message h3{margin-bottom:calc(var(--gap)*.5)}.source-message p{color:var(--muted);max-width:var(--measure)}.resume{display:flex;gap:var(--gap);align-items:center;padding:calc(var(--gap)*.75);border-radius:var(--radius);background:var(--paper);max-width:350px}.resume img{width:52px;height:74px;object-fit:contain;border-radius:calc(var(--radius)*.75);background:#fff}.resume p{font-size:calc(var(--fs)/var(--ratio));margin-top:calc(var(--gap)*.25);color:var(--muted)}.resume .progress{color:var(--accent)}.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:var(--edge) solid color-mix(in srgb,var(--muted) 22%,transparent);display:flex;justify-content:center;padding:calc(var(--gap)*.5) var(--gap) calc(var(--gap)*.75);z-index:3}.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;flex:1;max-width:160px;color:var(--muted);font-size:calc(var(--fs)/var(--ratio));padding:0}.tabbar button[aria-current=page]{color:var(--accent)}.tab-icon{font-size:calc(var(--fs)*var(--ratio));line-height:1.2}.empty{display:none;max-width:var(--measure);text-align:center;margin:calc(var(--gap)*4) auto;color:var(--muted)}.empty h2{color:var(--text);margin-bottom:var(--gap)}.empty button,.primary{background:var(--accent);color:var(--paper);border-radius:calc(var(--radius)*.75);min-height:44px;padding:calc(var(--gap)*.5) var(--gap);font-weight:650}.dark .primary,.dark .empty button{color:#000}.state-empty .normal{display:none}.state-empty .empty{display:block}.state-loading #catalog-body,.state-error #catalog-body{display:none}.state-loading .loading,.state-error .error{display:block}.loading,.error{display:none}.loading{padding:calc(var(--gap)*3) 0;color:var(--muted);text-align:center}.error{background:var(--paper);padding:var(--gap);border-radius:var(--radius)}.error p{color:var(--muted);margin:calc(var(--gap)*.5) 0}.error button{color:var(--accent);min-height:44px}.state-controls{display:flex;gap:var(--gap);margin-top:calc(var(--gap)*2);flex-wrap:wrap}.state-controls button{min-height:44px;font-size:calc(var(--fs)/var(--ratio));color:var(--muted)}dialog{border:0;background:var(--paper);color:var(--text);border-radius:var(--radius);width:min(500px,calc(100% - 32px));padding:calc(var(--gap)*1.5);box-shadow:0 calc(var(--gap)*.5) calc(var(--gap)*2) #0003}dialog::backdrop{background:#0006}dialog header{display:flex;justify-content:space-between;align-items:center;gap:var(--gap);margin-bottom:calc(var(--gap)*1.5)}dialog header button{min-height:44px;min-width:44px;color:var(--accent)}dialog p{color:var(--muted);font-size:calc(var(--fs)/var(--ratio));margin:var(--gap) 0}dialog input{width:100%;border:var(--edge) solid color-mix(in srgb,var(--muted) 40%,transparent);border-radius:calc(var(--radius)*.75);padding:calc(var(--gap)*.75);color:var(--text);background:var(--background);min-height:48px}dialog label{display:block;margin-bottom:calc(var(--gap)*.5)}dialog .primary{margin-top:var(--gap);width:100%}.search-result{margin-top:var(--gap);padding:var(--gap);background:var(--background);border-radius:calc(var(--radius)*.75)}[hidden]{display:none!important}@media(min-width:768px){.shell{padding-top:calc(var(--gap)*2.5)}.poster-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.header{margin-bottom:calc(var(--gap)*.5)}}
</style></head><body>
<main class="shell" data-node="discover">
<header class="header" data-node="discover/header"><div><h1>WeBox</h1><p class="subtitle">发现喜欢的影视，留住想看的故事。</p></div><button class="icon-button" aria-label="添加内容源" data-open="import">+</button></header>
<button class="search-button" data-node="discover/search" data-open="search"><span aria-hidden="true">⌕</span><span>搜索电影、剧集</span><span class="scope">全部内容源</span></button>
<div class="empty" data-node="discover/empty"><h2>从一个内容源开始</h2><p>导入你的内容源，建立属于自己的影视库。</p><button data-open="import">添加内容源</button></div>
<div class="normal">
<section data-node="discover/sources"><div class="section-heading"><h2>我的内容源</h2><button data-open="manage">管理</button></div><div class="chips"><button class="chip" aria-pressed="true" data-source="公开示例">公开示例</button><button class="chip" aria-pressed="false" data-source="4K影视">4K影视</button><button class="chip" aria-pressed="false" data-source="瓜子">瓜子</button><button class="chip" aria-pressed="false" data-source="磁力熊">磁力熊</button></div></section>
<section data-node="discover/catalog"><div class="section-heading"><h2 id="source-title">公开示例</h2><div class="actions"><button data-open="settings">配置</button><button data-open="browse">浏览全部 ›</button></div></div><div class="loading">正在为你展开片单…</div><div class="error"><h3>暂时无法加载</h3><p>内容源请求超时，请检查网络或配置后重试。</p><button id="retry">重试</button></div><div id="catalog-body"><div class="poster-grid" id="demo-catalog"><button class="poster-card" data-open="detail"><span class="poster"><img src="webox-icon.png" alt=""></span><h3>Big Buck Bunny</h3><p>Blender 开放电影</p></button></div><div class="source-message" id="source-catalog" hidden><h3>浏览所选内容源</h3><p>预览不访问第三方网站。App 会在这里加载该内容源实际返回的片单、筛选条件和海报。</p></div></div></section>
<section data-node="discover/recent"><div class="section-heading"><h2>继续观看</h2><button data-open="history">全部</button></div><button class="resume" data-open="detail"><img src="webox-icon.png" alt=""><span><h3>Big Buck Bunny</h3><p>公开示例</p><p class="progress">▶ 示例进度 · 2 分钟</p></span></button></section>
</div>

</main>
<nav class="tabbar" data-node="navigation"><button aria-current="page" data-tab="发现"><span class="tab-icon" aria-hidden="true">▣</span>发现</button><button data-tab="收藏"><span class="tab-icon" aria-hidden="true">♡</span>收藏</button><button data-tab="下载"><span class="tab-icon" aria-hidden="true">⇩</span>下载</button><button data-tab="设置"><span class="tab-icon" aria-hidden="true">⚙</span>设置</button></nav>
<dialog id="modal" data-node="dialog"><header><h2 id="modal-title">添加内容源</h2><button id="close-modal">完成</button></header><div id="modal-body"></div></dialog>
<script>
const modal=document.getElementById('modal'),body=document.getElementById('modal-body'),title=document.getElementById('modal-title');let selected='公开示例';
function openView(name){const views={import:['添加内容源','<label for="source-url">内容源链接</label><input id="source-url" placeholder="https://example.com/source.js"><p>支持 JS、订阅、M3U 及 VOD 配置；预览不会实际导入文件。</p><button class="primary" id="import-action">添加</button>'],search:['搜索','<label for="query">电影、剧集或关键词</label><input id="query" placeholder="试试 Big Buck Bunny"><button class="primary" id="search-action">搜索全部内容源</button><div id="search-results"></div>'],settings:['内容源配置','<label for="setting">网站地址 / 源配置</label><input id="setting" placeholder="由内容源声明的配置项"><p>App 会按源声明显示选择项、Cookie、安全输入框与其他设置。</p><button class="primary" id="save-action">保存配置</button>'],detail:['Big Buck Bunny','<p>Blender Foundation 开放电影 · 公开测试视频。</p><button class="primary" id="play-action">立即播放</button><p>真实播放由 App 内播放器处理。此离线预览只演示交互与页面层级。</p>'],manage:['内容源管理','<p>公开示例、4K影视、瓜子、磁力熊。</p><p>可导入文件、添加链接、进入配置或删除内容源。</p><button class="primary" id="add-source-action">添加内容源</button>'],browse:[selected,'<p>这里对应完整片单页，包含栏目切换、筛选、分页与源内搜索。</p><button class="primary" id="filter-action">筛选</button>'],history:['观看历史','<p>示例：Big Buck Bunny · 2 分钟。</p>'],收藏:['我的收藏','<p>把想看的故事留在这里。在影片详情页轻点收藏，下一次更容易找到。</p>'],下载:['下载','<p>把故事带在身边。在 App 中下载后可离线播放。</p>'],设置:['设置','<p>内容源管理、备份恢复、TMDB 元数据配置、播放设置和开源许可。</p><button class="primary" id="add-source-action">添加内容源</button>']};const view=views[name]||views.browse;title.textContent=view[0];body.innerHTML=view[1];if(!modal.open)modal.showModal();}
document.addEventListener('click',e=>{const trigger=e.target.closest('[data-open]');if(trigger)openView(trigger.dataset.open);if(e.target.id==='close-modal')modal.close();if(e.target.id==='add-source-action')openView('import');if(e.target.id==='save-action'||e.target.id==='import-action')body.innerHTML='<p>预览已记录此操作。正式 App 会完成验证并保存配置。</p>';if(e.target.id==='play-action')body.innerHTML='<p>播放界面会在 App 中全屏打开。</p>';if(e.target.id==='search-action'){const q=document.getElementById('query').value.trim();document.getElementById('search-results').innerHTML=q?'<div class="search-result">公开示例 · Big Buck Bunny</div>':'<p>请输入搜索词。</p>';}if(e.target.id==='filter-action')body.innerHTML='<label for="category">分类</label><input id="category" value="全部"><button class="primary" id="save-action">应用筛选</button>';const source=e.target.closest('[data-source]');if(source){selected=source.dataset.source;document.querySelectorAll('[data-source]').forEach(x=>x.setAttribute('aria-pressed',String(x===source)));document.getElementById('source-title').textContent=selected;document.getElementById('demo-catalog').hidden=selected!=='公开示例';document.getElementById('source-catalog').hidden=selected==='公开示例';}const state=e.target.closest('[data-state]');if(state){document.body.classList.remove('state-empty','state-loading','state-error');if(state.dataset.state!=='normal')document.body.classList.add('state-'+state.dataset.state);}if(e.target.id==='retry')document.body.classList.remove('state-error');if(e.target.id==='theme')document.documentElement.classList.toggle('dark');const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.removeAttribute('aria-current'));tab.setAttribute('aria-current','page');if(tab.dataset.tab!=='发现')openView(tab.dataset.tab);}});
modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});
</script></body></html>
