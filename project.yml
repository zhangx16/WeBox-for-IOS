name: WeBox
options:
  bundleIdPrefix: com.zhangx16
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: WeBox
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    CODE_SIGN_STYLE: Automatic
targets:
  WeBox:
    type: application
    platform: iOS
    sources:
      - path: WeBox
        excludes: [Resources]
      - path: WeBox/Resources
        buildPhase: resources
    info:
      path: WeBox/Info.plist
      properties:
        CFBundleDisplayName: WeBox
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [WeBoxIcon]
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [WeBoxIcon]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: WeBox content source
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.javascript-source, public.json, public.plain-text]
  WeBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WeBoxTests]
    dependencies:
      - target: WeBox
schemes:
  WeBox:
    build:
      targets:
        WeBox: all
        WeBoxTests: [test]
    test:
      targets: [WeBoxTests]
      gatherCoverageData: true
